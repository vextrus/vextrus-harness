[project]
name = "vextrus_cad"
version = "0.1.0"
description = "The Vextrus CAD lane: drawing ingestion and validation."
requires-python = ">=3.13,<3.14"
dependencies = [
  "ezdxf==1.4.4",
  "pypdfium2==5.13.0",
  "numpy==2.5.2",
  "opencv-python-headless==4.13.0.90",
]

[project.scripts]
vextrus-cad = "vextrus_cad.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.2",
]
# D-04: the permissive vector-PDF writer for fixtures generation only. The
# licence scan refuses it anywhere else in this file.
fixtures = [
  "reportlab==4.4.9",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vextrus_cad"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
